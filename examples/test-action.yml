name: Test Model Guard Action
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '**/*.pkl'
      - '**/*.pt'
      - '**/*.safetensors'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}