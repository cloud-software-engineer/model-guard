name: Test Model Guard Action

on:
  push:
    branches: 
      - main
  pull_request:
    paths:
      - '**/*.pkl'
      - '**/*.pt'
      - '**/*.safetensors'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Model Guard
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}