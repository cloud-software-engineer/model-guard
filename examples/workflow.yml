name: AI Model Security
on:
  pull_request:
    paths:
      - '**/*.bin'
      - '**/*.pt'
      - '**/*.pkl'
      - '**/*.safetensors'
      - '**/*.gguf'
      - '**/*.onnx'
      - '**/requirements.txt'
      - '**/pyproject.toml'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cloud-software-engineer/model-guard@v1 # <-- Recuerda cambiar tu-usuario
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}